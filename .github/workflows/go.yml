name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.2'

    - name: Build
      run: go build -v ./...

    - name: Go fmt
      run: |
        # Fail the job if any files are not gofmt-clean.
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::The following files are not gofmt-clean:"
          echo "$unformatted"
          echo "Run 'go fmt ./...' and commit the changes."
          exit 1
        fi

    - name: Go vet
      run: go vet ./...